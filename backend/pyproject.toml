[project]
name = "ai-tracker"
version = "0.1.0"
description = "Локальный API проверки упоминаний бренда в ответах ИИ-моделей"
readme = "README.md"
authors = [
    { name = "977ADAM", email = "977team.95@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "uvicorn>=0.30,<1"
]

[dependency-groups]
dev = [
    "pytest>=8"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
