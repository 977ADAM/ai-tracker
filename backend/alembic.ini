[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# The target database is resolved by `migrations/env.py` from
# `AI_TRACKER_DATABASE_URL` (the same variable the application uses), so a
# deployment never repeats its URL here. Set it in this file only to override
# that resolution for a one-off command.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
