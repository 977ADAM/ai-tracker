name: ai-tracker

services:
  backend:
    build:
      context: ./backend
    image: ai-tracker-backend:local
    environment:
      AI_TRACKER_CONFIG_DIR: /data
      AI_TRACKER_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    volumes:
      - ai-tracker-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: ai-tracker-frontend:local
    environment:
      AI_TRACKER_API_URL: http://backend:8000
      AI_TRACKER_API_HOSTS: ${AI_TRACKER_API_HOSTS:-backend}
      ORIGIN: http://localhost:3000
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ai-tracker-data:
