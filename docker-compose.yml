name: ai-tracker

services:
  backend:
    build:
      context: ./backend
    image: ai-tracker-backend:local
    environment:
      AI_TRACKER_CONFIG_DIR: /data
      AI_TRACKER_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    volumes:
      - ai-tracker-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    # The interface waits for the API, so the API has to report its own health.
    # The probe reads PORT, so changing the port above keeps it working.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, urllib.request; port = os.environ.get('PORT', '8000'); sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:' + port + '/api/providers', timeout=4).status < 500 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: ai-tracker-frontend:local
    environment:
      AI_TRACKER_API_URL: http://backend:8000
      AI_TRACKER_API_HOSTS: backend
      ORIGIN: http://localhost:3001
      HOST: 0.0.0.0
      PORT: 3001
    ports:
      - "3001:3001"
    # Liveness only: the page itself needs the API, so any answer means the
    # server is up; the API has its own probe above.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/').then(() => process.exit(0)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ai-tracker-data:
