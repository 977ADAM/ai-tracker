name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      commit:
        description: Commit to check before deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
        env:
          AI_TRACKER_BASE_PATH: /clustering/tracker

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai-tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai-tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      AI_TRACKER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai-tracker
      AI_TRACKER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai-tracker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.1'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest
